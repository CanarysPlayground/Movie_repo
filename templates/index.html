<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Simple Movie Website</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .movie { border: 1px solid #ddd; padding: 10px; margin-bottom: 8px; }
    .controls { margin-top: 10px; }
    #playlist { margin-top: 20px; }
    #authSection { margin-bottom: 20px; padding: 15px; background: #f5f5f5; border-radius: 5px; }
    .auth-form { display: inline-block; margin-right: 20px; }
    .auth-form input { margin: 5px; padding: 5px; }
    .auth-form button { padding: 5px 10px; }
    #userInfo { display: none; }
    #loginForms { display: block; }
    .error { color: red; }
    .success { color: green; }
  </style>
</head>
<body>
  <h1>Simple Movie Website</h1>
  
  <div id="authSection">
    <div id="loginForms">
      <div class="auth-form">
        <h3>Register</h3>
        <input type="text" id="regUsername" placeholder="Username" />
        <input type="password" id="regPassword" placeholder="Password" />
        <button onclick="register()">Register</button>
      </div>
      <div class="auth-form">
        <h3>Login</h3>
        <input type="text" id="loginUsername" placeholder="Username" />
        <input type="password" id="loginPassword" placeholder="Password" />
        <button onclick="login()">Login</button>
      </div>
    </div>
    <div id="userInfo">
      <p>Welcome, <strong id="currentUsername"></strong>!</p>
      <button onclick="logout()">Logout</button>
    </div>
    <div id="authMessage"></div>
  </div>

  <div id="movies"></div>

  <h2>Your Playlist</h2>
  <div id="playlist"></div>

<script>
let currentUser = null;

async function checkAuth() {
  try {
    const res = await fetch('/api/user');
    if (res.ok) {
      const data = await res.json();
      currentUser = data;
      document.getElementById('loginForms').style.display = 'none';
      document.getElementById('userInfo').style.display = 'block';
      document.getElementById('currentUsername').textContent = data.username;
      return true;
    } else {
      currentUser = null;
      document.getElementById('loginForms').style.display = 'block';
      document.getElementById('userInfo').style.display = 'none';
      return false;
    }
  } catch (e) {
    console.error('Auth check failed:', e);
    return false;
  }
}

async function register() {
  const username = document.getElementById('regUsername').value;
  const password = document.getElementById('regPassword').value;
  const msgDiv = document.getElementById('authMessage');
  
  try {
    const res = await fetch('/api/register', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username, password})
    });
    const data = await res.json();
    
    if (res.ok) {
      msgDiv.innerHTML = '<p class="success">' + data.message + ' Please login.</p>';
      document.getElementById('regUsername').value = '';
      document.getElementById('regPassword').value = '';
    } else {
      msgDiv.innerHTML = '<p class="error">' + data.error + '</p>';
    }
  } catch (e) {
    msgDiv.innerHTML = '<p class="error">Registration failed</p>';
  }
}

async function login() {
  const username = document.getElementById('loginUsername').value;
  const password = document.getElementById('loginPassword').value;
  const msgDiv = document.getElementById('authMessage');
  
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username, password})
    });
    const data = await res.json();
    
    if (res.ok) {
      msgDiv.innerHTML = '<p class="success">' + data.message + '</p>';
      document.getElementById('loginUsername').value = '';
      document.getElementById('loginPassword').value = '';
      await checkAuth();
      fetchMovies();
      loadPlaylist();
    } else {
      msgDiv.innerHTML = '<p class="error">' + data.error + '</p>';
    }
  } catch (e) {
    msgDiv.innerHTML = '<p class="error">Login failed</p>';
  }
}

async function logout() {
  try {
    await fetch('/api/logout', { method: 'POST' });
    currentUser = null;
    document.getElementById('authMessage').innerHTML = '<p class="success">Logged out successfully</p>';
    await checkAuth();
    document.getElementById('movies').innerHTML = '';
    document.getElementById('playlist').innerHTML = '<em>Please login to view your playlist</em>';
  } catch (e) {
    console.error('Logout failed:', e);
  }
}

async function fetchMovies() {
  const res = await fetch('/api/movies');
  const movies = await res.json();
  const container = document.getElementById('movies');
  container.innerHTML = '';
  movies.forEach(m => {
    const div = document.createElement('div');
    div.className = 'movie';
    div.innerHTML = `<strong>${m.title} (${m.year})</strong> <br/> <em>${m.genre}</em><p>${m.synopsis}</p>`;
    const viewBtn = document.createElement('button');
    viewBtn.textContent = 'View Details';
    viewBtn.onclick = async () => {
      const dres = await fetch('/api/movies/' + m.id);
      const details = await dres.json();
      alert(JSON.stringify(details, null, 2));
    };
    const addBtn = document.createElement('button');
    addBtn.textContent = 'Add to Playlist';
    addBtn.style.marginLeft = '8px';
    addBtn.onclick = async () => {
      if (!currentUser) {
        alert('Please login to add movies to your playlist');
        return;
      }
      const pres = await fetch('/api/playlist', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({movie_id: m.id})
      });
      const pj = await pres.json();
      if (pres.ok) { alert('Added to playlist'); loadPlaylist(); } else { alert('Error: ' + pj.error); }
    };
    div.appendChild(viewBtn);
    div.appendChild(addBtn);
    container.appendChild(div);
  });
}

async function loadPlaylist() {
  if (!currentUser) {
    document.getElementById('playlist').innerHTML = '<em>Please login to view your playlist</em>';
    return;
  }
  
  const res = await fetch('/api/playlist');
  if (res.status === 401) {
    document.getElementById('playlist').innerHTML = '<em>Please login to view your playlist</em>';
    return;
  }
  
  const items = await res.json();
  const container = document.getElementById('playlist');
  if (items.length === 0) { container.innerHTML = '<em>Playlist is empty</em>'; return; }
  container.innerHTML = items.map(i => `<div>${i.title} (${i.year}) - ${i.genre}</div>`).join('');
}

window.onload = async () => {
  await checkAuth();
  fetchMovies();
  loadPlaylist();
};
</script>
</body>
</html>
